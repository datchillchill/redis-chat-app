<!DOCTYPE html>
<html>

<head>
    <title>Redis Multi-Room Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
        }

        .auth-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .auth-box h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #2c3e50;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .auth-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }

        .btn-register {
            background: #e0e0e0;
            color: #2c3e50;
        }

        .btn-register:hover {
            background: #d0d0d0;
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .toggle-text button {
            background: none;
            border: none;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-error {
            background: #e74c3c;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .chat-container {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: row;
        }

        #sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            color: white;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        #sidebar::-webkit-scrollbar {
            width: 6px;
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .sidebar-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h1 {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: rgba(231, 76, 60, 0.8);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 1);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .sidebar-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            padding: 15px 20px 8px;
            font-weight: 600;
        }

        #room-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 10px;
        }

        .room-item {
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            margin: 0 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .room-item::before {
            content: '#';
            opacity: 0.5;
        }

        .room-item:hover {
            background: rgba(102, 126, 234, 0.2);
            color: white;
        }

        .room-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .create-room-section {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }

        .create-room-section input {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 13px;
        }

        .create-room-section input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .create-room-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.3);
        }

        .create-room-section button {
            width: 100%;
            padding: 8px 10px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .create-room-section button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #online-users {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: auto;
            padding-bottom: 20px;
        }

        #user-list {
            list-style: none;
            padding: 10px;
        }

        #user-list li {
            padding: 8px 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-radius: 8px;
            margin: 0 10px;
            transition: all 0.3s;
        }

        #user-list li:hover {
            background: rgba(102, 126, 234, 0.2);
            color: white;
        }

        #user-list li.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #user-list li .avatar-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        #user-list li .status-dot {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 5px;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .chat-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h2 {
            font-size: 18px;
            color: #2c3e50;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header h2.room-header::before {
            content: '#';
            color: #667eea;
            font-size: 20px;
            font-weight: bold;
        }

        .chat-header h2.private-header::before {
            content: '@';
            color: #2ecc71;
            font-size: 20px;
            font-weight: bold;
        }

        #messages {
            list-style: none;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }

        #messages>li {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            background: white;
            object-fit: cover;
        }

        .message-content {
            flex: 1;
        }

        #messages>li.received-message {
            background: white;
            color: #2c3e50;
            border-left: 4px solid #e0e0e0;
            align-self: flex-start;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #messages>li.sent-message {
            background: linear-gradient(135deg, #1e90ff 0%, #003d7a 100%);
            color: white;
            align-self: flex-end;
            box-shadow: 0 2px 8px rgba(30, 144, 255, 0.4);
            flex-direction: row-reverse;
        }

        .system-message {
            color: white;
            font-style: italic;
            text-align: center;
            align-self: center;
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%) !important;
            border: 1px solid rgba(155, 89, 182, 0.4) !important;
            box-shadow: 0 2px 8px rgba(155, 89, 182, 0.3) !important;
            max-width: 100%;
            margin: 10px 0;
            gap: 0 !important;
            justify-content: center !important;
        }

        .system-message .message-avatar {
            display: none;
        }

        .timestamp {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
        }

        .user {
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        #messages>li.received-message .user {
            color: #667eea;
        }

        #form {
            background: white;
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #e0e0e0;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
        }

        #input {
            flex: 1;
            border: 1px solid #e0e0e0;
            padding: 12px 16px;
            border-radius: 24px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        #input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #form>button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #form>button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }

        .error-message {
            background: #e74c3c;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            animation: slideIn 0.3s ease-out;
            max-width: fit-content;
            align-self: center;
        }

        .welcome-message {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #95a5a6;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h1 id="authTitle">Đăng Nhập</h1>
            <div class="auth-error" id="authError" style="display: none;"></div>

            <div class="form-group">
                <label>Tên người dùng</label>
                <input type="text" id="authUsername" placeholder="Nhập tên người dùng" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="authPassword" placeholder="Nhập mật khẩu" autocomplete="off">
            </div>

            <div class="auth-buttons">
                <button class="btn-login" id="submitBtn">Đăng Nhập</button>
                <button class="btn-register" id="toggleBtn">Tạo Tài Khoản</button>
            </div>

            <div class="toggle-text">
                <span id="toggleText">Chưa có tài khoản? </span>
                <button id="toggleLink">Đăng ký ngay</button>
            </div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div id="sidebar">
            <div class="sidebar-header">
                <h1>
                    <div class="logo"></div>ChatBox
                </h1>
                <div class="user-info">
                    <span id="currentUsername"></span>
                    <button class="logout-btn" id="logoutBtn">Đăng Xuất</button>
                </div>
                <button id="showStatsBtn"
                    style="width: 100%; margin-top: 10px; padding: 8px; background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;">Xem
                    Thống Kê</button>
            </div>

            <div class="sidebar-content">
                <div class="sidebar-section">
                    <h3>Phòng Chat</h3>
                    <div id="room-list"></div>
                </div>

                <div class="create-room-section">
                    <input type="text" id="newRoomNameInput" placeholder="Tên phòng mới">
                    <button id="createRoomBtn">Tạo phòng</button>
                </div>

                <div id="online-users" class="sidebar-section">
                    <h3>Online (<span id="user-count">0</span>)</h3>
                    <ul id="user-list"></ul>
                </div>
            </div>
        </div>

        <div id="main-content">
            <div class="chat-header">
                <h2 id="chatHeaderTitle" class="room-header">Chào mừng</h2>
            </div>

            <ul id="messages">
                <li class="system-message">👋 Chọn một phòng hoặc một người dùng để bắt đầu chat</li>
            </ul>

            <form id="form" style="display: none;">
                <input id="input" autocomplete="off" placeholder="Nhập tin nhắn..." />
                <button type="submit">Gửi</button>
            </form>
        </div>
    </div>
    <div id="statsModal"
        style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6);">
        <div class="modal-content"
            style="background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 10px; color: #2c3e50;">
            <span class="close" id="closeStatsModal"
                style="color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>
            <h2 style="margin-bottom: 15px;">Thống Kê Hệ Thống Chat</h2>
            <ul id="stats-list" style="list-style-type: none; padding: 0;">
                <!-- Dữ liệu sẽ được chèn vào đây bởi JavaScript -->
            </ul>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentMode = 'login';
        let authToken = localStorage.getItem('chatToken');
        let currentUsername = localStorage.getItem('chatUsername');
        let currentUserId = localStorage.getItem('chatUserId');

        const authContainer = document.getElementById('authContainer');
        const chatContainer = document.getElementById('chatContainer');
        const authTitle = document.getElementById('authTitle');
        const authError = document.getElementById('authError');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const submitBtn = document.getElementById('submitBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');
        const logoutBtn = document.getElementById('logoutBtn');
        const currentUsernameSpan = document.getElementById('currentUsername');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const roomListDiv = document.getElementById('room-list');
        const newRoomNameInput = document.getElementById('newRoomNameInput');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const userListUl = document.getElementById('user-list');
        const userCountSpan = document.getElementById('user-count');
        const chatHeaderTitle = document.getElementById('chatHeaderTitle');

        let currentActiveChat = { type: null, id: null, name: null };
        let messageCounter = 0;
        const statsModal = document.getElementById('statsModal');
        const showStatsBtn = document.getElementById('showStatsBtn');
        const closeStatsModal = document.getElementById('closeStatsModal');
        const statsListUl = document.getElementById('stats-list');

        // Kiểm tra token khi tải trang
        if (authToken && currentUsername && currentUserId) {
            authContainer.style.display = 'none';
            chatContainer.style.display = 'flex';
            currentUsernameSpan.textContent = currentUsername;
            socket.emit('authenticate', { token: authToken });
        }

        function showAuthError(message) {
            authError.textContent = message;
            authError.style.display = 'block';
            setTimeout(() => {
                authError.style.display = 'none';
            }, 5000);
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            messages.appendChild(errorDiv);
            messages.scrollTop = messages.scrollHeight;

            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        toggleLink.addEventListener('click', () => {
            currentMode = currentMode === 'login' ? 'register' : 'login';
            updateAuthForm();
        });

        toggleBtn.addEventListener('click', () => {
            currentMode = currentMode === 'login' ? 'register' : 'login';
            updateAuthForm();
        });

        function updateAuthForm() {
            if (currentMode === 'register') {
                authTitle.textContent = 'Tạo Tài Khoản';
                submitBtn.textContent = 'Đăng Ký';
                toggleBtn.textContent = 'Đăng Nhập';
                toggleText.textContent = 'Đã có tài khoản? ';
                toggleLink.textContent = 'Đăng nhập ngay';
            } else {
                authTitle.textContent = 'Đăng Nhập';
                submitBtn.textContent = 'Đăng Nhập';
                toggleBtn.textContent = 'Tạo Tài Khoản';
                toggleText.textContent = 'Chưa có tài khoản? ';
                toggleLink.textContent = 'Đăng ký ngay';
            }
            authPassword.value = '';
            authError.style.display = 'none';
        }

        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();

            if (!username || !password) {
                showAuthError('Vui lòng nhập tên người dùng và mật khẩu');
                return;
            }

            if (currentMode === 'login') {
                socket.emit('login', { username, password });
            } else {
                socket.emit('register', { username, password });
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('chatToken');
            localStorage.removeItem('chatUsername');
            localStorage.removeItem('chatUserId');
            location.reload();
        });

        socket.on('auth_success', (data) => {
            localStorage.setItem('chatToken', data.token);
            localStorage.setItem('chatUsername', data.username);
            localStorage.setItem('chatUserId', data.userId);
            currentUsername = data.username;
            currentUserId = data.userId;
            authToken = data.token;

            authContainer.style.display = 'none';
            chatContainer.style.display = 'flex';
            currentUsernameSpan.textContent = data.username;

            socket.emit('authenticate', { token: data.token });
        });

        socket.on('auth_verified', (data) => {
            console.log('Xác thực thành công');
            currentUsernameSpan.textContent = data.username;
            currentUserId = data.userId;
            if (!currentActiveChat.type) {
                messages.innerHTML = '<li class="system-message">👋 Chọn một phòng hoặc một người dùng để bắt đầu chat</li>';
            }
        });

        socket.on('error', (message) => {
            if (chatContainer.style.display === 'flex') {
                showError(message);
            } else {
                showAuthError(message);
            }
        });

        socket.on('room list', (rooms) => {
            roomListDiv.innerHTML = '';
            rooms.forEach(room => {
                const roomElement = document.createElement('div');
                roomElement.className = 'room-item';
                roomElement.setAttribute('data-room-id', room);
                roomElement.textContent = room;
                roomElement.addEventListener('click', () => joinRoom(room, room));
                roomListDiv.appendChild(roomElement);
            });
        });

        socket.on('online users list', (users) => {
            userListUl.innerHTML = '';
            userCountSpan.textContent = users.length;
            users.forEach(user => {
                if (user.userId !== currentUserId) {
                    const userElement = document.createElement('li');
                    userElement.setAttribute('data-user-id', user.userId);
                    userElement.innerHTML = `
                        <div class="status-dot"></div>
                        <img src="${user.avatar}" alt="${user.username}" class="avatar-small">
                        <span>${user.username}</span>
                    `;
                    userElement.addEventListener('click', () => startPrivateChat(user.userId, user.username, user.avatar));
                    userListUl.appendChild(userElement);
                }
            });
        });

        socket.on('history', (history) => {
            messages.innerHTML = '';
            history.forEach(msg => appendMessage(msg, false));
        });

        socket.on('chat message', (msg) => {
            if (currentActiveChat.type === 'room') {
                appendMessage(msg, false);
            }
        });

        socket.on('private chat history', ({ targetUserId, history }) => {
            messages.innerHTML = '';
            history.forEach(msg => appendMessage(msg, true));
        });

        socket.on('private message', (msg) => {
            if (currentActiveChat.type === 'private' &&
                (currentActiveChat.id === msg.senderId || currentActiveChat.id === msg.receiverId)) {
                appendMessage(msg, true);
            } else if (currentActiveChat.type === 'private') {
                // Nếu đang chat với người khác, hiển thị thông báo
                showError(`Tin nhắn mới từ ${msg.senderUsername}`);
            }
        });

        socket.on('room online users', (users) => {
            // Cập nhật danh sách người dùng online trong phòng nếu cần
        });

        const formatTime = (timestamp) => {
            return new Date(timestamp).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        };

        const appendMessage = (msg, isPrivate = false) => {
            const item = document.createElement('li');

            let messageSender = '';
            let messageAvatar = '';
            let isSentMessage = false;

            if (isPrivate) {
                messageSender = msg.senderUsername;
                messageAvatar = msg.avatar;
                isSentMessage = (msg.senderId === currentUserId);
            } else {
                messageSender = msg.user;
                messageAvatar = msg.avatar;
                isSentMessage = (msg.userId === currentUserId);
            }

            if (msg.isSystem) {
                item.className = 'system-message';
                item.innerHTML = msg.text;
            } else {
                const avatarImg = messageAvatar ? `<img src="${messageAvatar}" alt="${messageSender}" class="message-avatar">` : '<div class="message-avatar"></div>';
                item.innerHTML = `${avatarImg}<div class="message-content"><span class="user">${messageSender}</span>${msg.text}<span class="timestamp">${formatTime(msg.timestamp)}</span></div>`;

                if (isSentMessage) {
                    item.classList.add('sent-message');
                } else {
                    item.classList.add('received-message');
                }
            }

            messages.appendChild(item);
            messageCounter++;
            messages.scrollTop = messages.scrollHeight;
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                const messageText = input.value.trim();
                if (currentActiveChat.type === 'room') {
                    socket.emit('chat message', { text: messageText });
                } else if (currentActiveChat.type === 'private') {
                    socket.emit('send private message', { receiverUserId: currentActiveChat.id, text: messageText });
                }
                input.value = '';
                input.focus();
            }
        });

        function joinRoom(roomId, roomName) {
            if (currentActiveChat.type === 'room' && currentActiveChat.id === roomId) return;

            // Xóa trạng thái active
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('#user-list li').forEach(el => el.classList.remove('active'));

            // Đặt trạng thái active mới
            const newRoomElement = document.querySelector(`.room-item[data-room-id="${roomId}"]`);
            if (newRoomElement) {
                newRoomElement.classList.add('active');
            }

            currentActiveChat = { type: 'room', id: roomId, name: roomName };
            socket.emit('join room', { roomId });

            messages.innerHTML = '';
            messageCounter = 0;
            chatHeaderTitle.textContent = roomName;
            chatHeaderTitle.className = 'room-header';
            form.style.display = 'flex';
            input.focus();
        }

        function startPrivateChat(userId, username, avatar) {
            if (userId === currentUserId) {
                showError('Bạn không thể tự nhắn tin cho chính mình.');
                return;
            }
            if (currentActiveChat.type === 'private' && currentActiveChat.id === userId) return;

            // Xóa trạng thái active
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('#user-list li').forEach(el => el.classList.remove('active'));

            // Đặt trạng thái active mới
            const newUserElement = document.querySelector(`#user-list li[data-user-id="${userId}"]`);
            if (newUserElement) {
                newUserElement.classList.add('active');
            }

            currentActiveChat = { type: 'private', id: userId, name: username };
            socket.emit('get private history', { targetUserId: userId });

            messages.innerHTML = '';
            messageCounter = 0;
            chatHeaderTitle.textContent = username;
            chatHeaderTitle.className = 'private-header';
            form.style.display = 'flex';
            input.focus();
        }

        createRoomBtn.addEventListener('click', () => {
            const roomName = newRoomNameInput.value.trim();
            if (roomName) {
                socket.emit('create room', { roomName });
                newRoomNameInput.value = '';
            } else {
                showError('Vui lòng nhập tên phòng');
            }
        });

        newRoomNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const roomName = newRoomNameInput.value.trim();
                if (roomName) {
                    socket.emit('create room', { roomName });
                    newRoomNameInput.value = '';
                }
            }
        });

        socket.on('room created', (roomName) => {
            showError(`Phòng "${roomName}" đã được tạo thành công`);
        });

        socket.on('room list', (rooms) => {
            roomListDiv.innerHTML = '';
            rooms.forEach(room => {
                const roomElement = document.createElement('div');
                roomElement.className = 'room-item';
                roomElement.setAttribute('data-room-id', room);
                roomElement.textContent = room;
                roomElement.addEventListener('click', () => joinRoom(room, room));
                roomListDiv.appendChild(roomElement);
            });
        });

        // Lắng nghe cập nhật danh sách phòng từ Redis Pub/Sub
        socket.on('room list', (rooms) => {
            const currentRoomId = currentActiveChat.type === 'room' ? currentActiveChat.id : null;
            roomListDiv.innerHTML = '';
            rooms.forEach(room => {
                const roomElement = document.createElement('div');
                roomElement.className = 'room-item';
                if (room === currentRoomId) {
                    roomElement.classList.add('active');
                }
                roomElement.setAttribute('data-room-id', room);
                roomElement.textContent = room;
                roomElement.addEventListener('click', () => joinRoom(room, room));
                roomListDiv.appendChild(roomElement);
            });
        });

        // Lắng nghe cập nhật danh sách người dùng online
        socket.on('online users list', (users) => {
            const currentUserId_private = currentActiveChat.type === 'private' ? currentActiveChat.id : null;
            userListUl.innerHTML = '';
            userCountSpan.textContent = users.length;
            users.forEach(user => {
                if (user.userId !== currentUserId) {
                    const userElement = document.createElement('li');
                    userElement.setAttribute('data-user-id', user.userId);
                    if (user.userId === currentUserId_private) {
                        userElement.classList.add('active');
                    }
                    userElement.innerHTML = `
                        <div class="status-dot"></div>
                        <img src="${user.avatar}" alt="${user.username}" class="avatar-small">
                        <span>${user.username}</span>
                    `;
                    userElement.addEventListener('click', () => startPrivateChat(user.userId, user.username, user.avatar));
                    userListUl.appendChild(userElement);
                }
            });
        });

        // Mở modal khi bấm nút
        showStatsBtn.addEventListener('click', () => {
            socket.emit('get stats'); // Gửi yêu cầu lấy thống kê lên server
        });

        // Đóng modal khi bấm dấu 'x'
        closeStatsModal.addEventListener('click', () => {
            statsModal.style.display = 'none';
        });

        // Đóng modal khi bấm ra ngoài vùng nội dung
        window.addEventListener('click', (event) => {
            if (event.target == statsModal) {
                statsModal.style.display = 'none';
            }
        });

        // Lắng nghe sự kiện 'stats' từ server và cập nhật modal
        socket.on('stats', (stats) => {
            if (stats) {
                // Cập nhật nội dung cho modal
                statsListUl.innerHTML = `
            <li style="padding: 8px 0; border-bottom: 1px solid #eee;">Tổng số tin nhắn đã gửi: <strong>${stats.totalMessages}</strong></li>
            <li style="padding: 8px 0; border-bottom: 1px solid #eee;">Tổng số người dùng đã đăng ký: <strong>${stats.totalRegisteredUsers}</strong></li>
            <li style="padding: 8px 0; border-bottom: 1px solid #eee;">Số phòng đang hoạt động: <strong>${stats.activeRoomsCount}</strong></li>
            <li style="padding: 8px 0;">Danh sách phòng: <strong>${stats.activeRoomsList.join(', ')}</strong></li>
        `;
                // Hiển thị modal
                statsModal.style.display = 'block';
            } else {
                showError('Không thể tải thống kê.');
            }
        });
    </script>
