<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Redis Chat App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h1 id="authTitle">Đăng Nhập</h1>
            <div class="auth-error" id="authError" style="display: none;"></div>

            <div class="form-group">
                <label>Tên người dùng</label>
                <input type="text" id="authUsername" placeholder="Nhập tên người dùng" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="authPassword" placeholder="Nhập mật khẩu" autocomplete="off">
            </div>

            <div class="auth-buttons">
                <button class="btn-login" id="submitBtn">Đăng Nhập</button>
                <button class="btn-register" id="toggleBtn">Tạo Tài Khoản</button>
            </div>

            <div class="toggle-text">
                <span id="toggleText">Chưa có tài khoản? </span>
                <button id="toggleLink">Đăng ký ngay</button>
            </div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div id="sidebar">
            <div class="sidebar-header">
                <h1>
                    <div class="logo"></div>ChatBox
                </h1>
                <div class="user-info">
                    <span id="currentUsername"></span>
                    <button class="logout-btn" id="logoutBtn">Đăng Xuất</button>
                </div>
            </div>

            <div class="sidebar-content">
                <div class="sidebar-section">
                    <h3>Phòng Chat</h3>
                    <div id="room-list"></div>
                </div>

                <div class="create-room-section">
                    <input type="text" id="newRoomNameInput" placeholder="Tên phòng mới">
                    <button id="createRoomBtn">Tạo phòng</button>
                </div>

                <div id="online-users" class="sidebar-section">
                    <h3>Online (<span id="user-count">0</span>)</h3>
                    <ul id="user-list"></ul>
                </div>
            </div>
        </div>

        <div id="main-content">
            <div class="chat-header">
                <h2 id="chatHeaderTitle" class="room-header">Chào mừng</h2>
                <button id="searchBtn"
                    style="background:none; border:none; cursor:pointer; font-size: 20px; padding: 5px; border-radius: 50%;">🔍</button>
            </div>

            <div id="pinnedMessageBar" class="pinned-message-bar">
            </div>

            <div id="searchContainer" class="search-container">
                <input type="text" id="searchInput" placeholder="Tìm kiếm tin nhắn...">
                <div class="search-nav">
                    <span id="searchCount">0/0</span>
                    <button id="prevResultBtn" disabled title="Kết quả trước">🔼</button>
                    <button id="nextResultBtn" disabled title="Kết quả tiếp theo">🔽</button>
                </div>
                <button id="closeSearchBtn"
                    style="background:none; border:none; cursor:pointer; font-size: 18px; color: #65676b;">✕</button>
            </div>

            <ul id="messages">
                <li class="system-message">Chọn một phòng hoặc một người dùng để bắt đầu chat</li>
            </ul>

            <div id="typingIndicator" class="typing-indicator"></div>

            <div id="replyPreview" class="reply-preview"></div>

            <form id="form" style="display: none;">
                <input type="file" id="fileInput" style="display: none;"
                    accept="image/*, application/pdf, .doc, .docx, .xls, .xlsx, .zip, .rar">

                <button type="button" id="uploadBtn" title="Đính kèm tệp">📎</button>

                <input id="input" autocomplete="off" placeholder="Nhập tin nhắn..." />
                <button type="submit">Gửi</button>
            </form>
        </div>
    </div>

    <audio id="notificationSound" src="/notification.mp3" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/main.js"></script>
</body>

</html>
