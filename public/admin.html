<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: #f0f2f5;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 20px;
        }

        .sidebar-nav {
            flex-grow: 1;
        }

        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav a {
            display: block;
            padding: 15px 20px;
            color: #bdc3c7;
            text-decoration: none;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover {
            background: #34495e;
            color: white;
        }

        .sidebar-nav a.active {
            background: #34495e;
            color: white;
            border-left-color: #3498db;
        }

        .sidebar-footer {
            padding: 20px;
        }

        #logoutBtn {
            background: #c0392b;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .action-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .action-btn { margin-right: 5px; }
        .action-btn.edit { background: #3498db; color: white; }
        .action-btn.delete { background: #e74c3c; color: white; }
        .add-form { margin-top: 20px; padding: 20px; background: white; border-radius: 8px; display: flex; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .add-form input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .add-form button { padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-box h2 { margin-top: 0; }
        .modal-actions { margin-top: 20px; text-align: right; }
        .modal-actions button { border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Admin</h1>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="#users" id="nav-users" class="nav-link active">Quản lý Người dùng</a></li>
                <li><a href="#rooms" id="nav-rooms" class="nav-link">Quản lý Phòng</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer"><button id="logoutBtn">Đăng xuất</button></div>
    </div>

    <main class="main-content">
        <section id="users-section" class="content-section active">
            <h2>Quản lý Người dùng</h2>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>User ID</th>
                        <th>Ngày tham gia</th>
                        <th>Số tin nhắn</th>
                        <th>Status</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
        <section id="rooms-section" class="content-section">
            <h2>Quản lý Phòng</h2>
            <table id="roomsTable">
                <thead>
                    <tr>
                        <th>Tên phòng</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="add-form">
                <input type="text" id="newRoomInput" placeholder="Nhập tên phòng mới...">
                <button id="addRoomBtn">Thêm phòng</button>
            </div>
        </section>
    </main>
        <div id="editRoomModal" class="modal-overlay">
            <div class="modal-box">
                <h2>Sửa tên phòng</h2>
                <input type="text" id="editRoomNameInput" style="width: 100%; padding: 10px; margin-top: 15px; box-sizing: border-box;">
                <div class="modal-actions">
                    <button id="cancelEditBtn" style="background: #7f8c8d; color: white;">Hủy</button>
                    <button id="saveEditBtn" style="background: #007bff; color: white;">Lưu thay đổi</button>
                </div>
            </div>
        </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log('✅ Đã kết nối tới server với tư cách Admin');
        });

        // Lắng nghe tín hiệu từ server và tự động làm mới danh sách phòng
        socket.on('admin_rooms_updated', () => {
            console.log('Nhận được cập nhật danh sách phòng, tải lại...');
            fetchRooms();
        });

        // Lắng nghe sự kiện cập nhật danh sách người dùng
        socket.on('admin_users_updated', () => {
            console.log('Nhận được cập nhật danh sách người dùng, tải lại...');
            fetchUsers(); 
        });

        const navLinks = document.querySelectorAll('.nav-link');
        const contentSections = document.querySelectorAll('.content-section');
        const defaultRooms = ['Phòng Chung', 'Công Nghệ', 'Học Tập'];

        function showSection(targetId) {
            navLinks.forEach(link => link.classList.remove('active'));
            contentSections.forEach(section => section.classList.remove('active'));
            document.getElementById(`nav-${targetId}`).classList.add('active');
            document.getElementById(`${targetId}-section`).classList.add('active');
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = e.target.id.split('-')[1];
                showSection(targetId);
            });
        });

        // === LOGIC TẢI DỮ LIỆU ===
        async function fetchUsers() {
            try {
                const response = await fetch('/api/admin/users');
                if (!response.ok) throw new Error('Lỗi tải dữ liệu người dùng.');

                const users = await response.json();
                const tableBody = document.querySelector('#usersTable tbody');
                tableBody.innerHTML = '';

                users.sort((a, b) => new Date(b.joinedAt) - new Date(a.joinedAt));

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${user.username}</strong></td>
                        <td>${user.userId}</td>
                        <td>${new Date(user.joinedAt).toLocaleString('vi-VN')}</td>
                        <td>${user.messageCount}</td>
                        <td>${user.status}</td>
                        <td><button class="action-btn">Xóa</button></td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                document.querySelector('#usersTable tbody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Lỗi tải dữ liệu.</td></tr>';
            }
        }

        async function fetchRooms() {
            try {
                const response = await fetch('/api/admin/rooms');
                if (!response.ok) throw new Error('Lỗi tải dữ liệu phòng.');
                
                const rooms = await response.json();
                const tableBody = document.querySelector('#roomsTable tbody');
                tableBody.innerHTML = '';

                rooms.forEach(room => {
                    const row = document.createElement('tr');
                    const isDefault = defaultRooms.includes(room);
                    row.innerHTML = `
                        <td># ${room}</td>
                        <td>
                            <button class="action-btn edit" data-room-name="${room}" ${isDefault ? 'disabled' : ''}>Sửa</button>
                            <button class="action-btn delete" data-room-name="${room}" ${isDefault ? 'disabled title="Không thể xóa phòng mặc định"' : ''}>Xóa</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                document.querySelector('#roomsTable tbody').innerHTML = '<tr><td colspan="2" style="text-align: center; color: red;">Lỗi tải dữ liệu.</td></tr>';
            }
        }

        // HÀM MỚI ĐỂ XỬ LÝ XÓA PHÒNG
        async function handleDeleteRoom(event) {
            const roomName = event.target.dataset.roomName;
            if (confirm(`Bạn có chắc chắn muốn xóa phòng "${roomName}" không? Mọi tin nhắn trong phòng sẽ bị mất.`)) {
                try {
                    const response = await fetch('/api/admin/rooms', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roomName: roomName })
                    });
                    if (!response.ok) {
                        const result = await response.json();
                        alert(result.message || 'Xóa thất bại.');
                    }
                } catch (err) {
                    alert('Đã xảy ra lỗi khi xóa phòng.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            showSection('users');
            fetchUsers();
            fetchRooms();
        });

        // Xử lý đăng xuất
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/admin/logout', { method: 'POST' });
            window.location.href = '/admin-login.html';
        })

        // Thêm phòng mới
        document.getElementById('addRoomBtn').addEventListener('click', async () => {
            const input = document.getElementById('newRoomInput');
            const roomName = input.value.trim();
            if (!roomName) return alert('Vui lòng nhập tên phòng.');

            try {
                const response = await fetch('/api/admin/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomName })
                });
                if (!response.ok) {
                    const result = await response.json();
                    throw new Error(result.message);
                }
                input.value = ''; 
            } catch (err) { alert(`Lỗi: ${err.message}`); }
        });

        // Mở Modal Sửa hoặc Xóa
        document.querySelector('#usersTable tbody').addEventListener('click', (e) => {
        });
        document.querySelector('#roomsTable tbody').addEventListener('click', (e) => {
            if (e.target.classList.contains('edit')) {
                const roomName = e.target.dataset.roomName;
                const modal = document.getElementById('editRoomModal');
                const input = document.getElementById('editRoomNameInput');
                input.value = roomName;
                modal.dataset.oldRoomName = roomName;
                modal.style.display = 'flex';
            }
            if (e.target.classList.contains('delete')) {
                handleDeleteRoom(e.target.dataset.roomName);
            }
        });

        // Xử lý trong Modal Sửa
        const editModal = document.getElementById('editRoomModal');
        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const oldRoomName = editModal.dataset.oldRoomName;
            const newRoomName = document.getElementById('editRoomNameInput').value.trim();
            
            if (!newRoomName || newRoomName === oldRoomName) {
                editModal.style.display = 'none';
                return;
            }
            
            try {
                const response = await fetch('/api/admin/rooms', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldRoomName, newRoomName })
                });
                if (!response.ok) {
                    const result = await response.json();
                    throw new Error(result.message);
                }
                editModal.style.display = 'none';
            } catch (err) { alert(`Lỗi: ${err.message}`); }
        });

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            editModal.style.display = 'none';
        });

        // Hàm xử lý Xóa
        async function handleDeleteRoom(roomName) {
            if (confirm(`Bạn có chắc chắn muốn xóa phòng "${roomName}" không?`)) {
                try {
                    const response = await fetch('/api/admin/rooms', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roomName })
                    });
                    if (!response.ok) {
                        const result = await response.json();
                        throw new Error(result.message || 'Xóa thất bại.');
                    }
                } catch (err) { alert(`Lỗi: ${err.message}`); }
            }
        }
    </script>
</body>

</html>
